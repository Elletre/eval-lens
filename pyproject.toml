[project]
name = "eval-lens"
version = "0.1.0"
description = "Measure the measuring instrument: which eval cases carry information, what a suite's noise floor is, and what it costs."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Evgenii Miatlev" }]
keywords = ["llm-evals", "observability", "clickhouse", "opentelemetry", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "chdb>=4.4,<5",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "opentelemetry-sdk>=1.30",
]

[project.scripts]
eval-lens = "eval_lens.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eval_lens"]

[dependency-groups]
dev = ["mypy>=1.13", "pytest>=8.3", "ruff>=0.14"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ARG", "B", "C4", "E", "F", "I", "PTH", "RUF", "SIM", "UP", "W"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/eval_lens"]

[[tool.mypy.overrides]]
# chDB ships no type information; its session API is three untyped methods.
module = ["chdb", "chdb.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The one module allowed to call into that untyped API, so the rest stays strict.
module = ["eval_lens.store"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
